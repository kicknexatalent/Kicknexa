<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}KICKNEXA{% endblock %}</title><style>
body{margin:0;font-family:system-ui,Arial;background:#f7f9fc;color:#101828}.wrap{width:min(980px,92%);margin:30px auto}.brand{font-size:26px;font-weight:950;letter-spacing:.08em}.brand span{color:#155eef}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:25px;margin:18px 0}h1{font-size:38px;line-height:1.05}label{display:block;font-weight:750;margin:12px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}textarea{min-height:120px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}button,.btn{display:inline-block;border:0;border-radius:9px;padding:12px 17px;background:#155eef;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.outline{background:#fff;color:#101828;border:1px solid #d0d5dd}.muted{color:#667085}.notice{padding:12px;border-radius:10px;background:#ecfdf3;color:#027a48;margin:12px 0}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#155eef;font-weight:700;font-size:.85rem}.item{border-top:1px solid #eaecf0;padding:17px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="wrap"><a class="brand" href="/">KICK<span>NEXA</span></a>{% with msgs=get_flashed_messages() %}{% for m in msgs %}<div class="notice">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
