{% extends "base.html" %}{% block title %}Register Organization | KICKNEXA{% endblock %}{% block content %}<div class="card"><h1>Register your organization</h1><p class="muted">Clubs, academies, labels, event organizers, brands and other legitimate organizations can create profiles.</p><form method="post"><div class="grid"><div><label>Organization name<input required name="name"></label></div><div><label>Email<input required type="email" name="email"></label></div><div><label>Password<input required type="password" name="password" minlength="8"></label></div><div><label>Type<input name="organization_type" placeholder="Club, Academy, Label..."></label></div><div><label>Country<input name="country" value="Tanzania"></label></div><div><label>City<input name="city"></label></div><div><label>Website<input name="website" placeholder="https://"></label></div><div><label>Social profile<input name="social_url" placeholder="https://"></label></div><div class="full"><label>Description<textarea name="description"></textarea></label></div></div><button>Register Organization</button></form></div>{% endblock %}
