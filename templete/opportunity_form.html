{% extends "base.html" %}{% block title %}Post Opportunity | KICKNEXA{% endblock %}{% block content %}<div class="card"><h1>Post an opportunity</h1><form method="post"><div class="grid"><div><label>Title<input required name="title" placeholder="U18 Football Trial / Music Audition"></label></div><div><label>Category<select name="category"><option>Sports</option><option>Music</option></select></label></div><div><label>Talent / sport<input name="subcategory" placeholder="Football, Singer, DJ..."></label></div><div><label>Opportunity type<select name="opportunity_type"><option>Trial</option><option>Audition</option><option>Scholarship</option><option>Competition</option><option>Training</option><option>Gig</option><option>Sponsorship</option><option>Other</option></select></label></div><div><label>Country<input name="country" value="Tanzania"></label></div><div><label>City<input name="city"></label></div><div><label>Age/category<input name="age_category" placeholder="U18 / Open"></label></div><div><label>Deadline<input type="date" name="deadline"></label></div><div class="full"><label>Description<textarea required name="description"></textarea></label></div><div class="full"><label>Requirements<textarea name="requirements"></textarea></label></div><div><label>Application URL<input name="application_url" placeholder="https://"></label></div><div><label>Contact email<input type="email" name="contact_email"></label></div></div><button>Publish Opportunity</button></form></div>{% endblock %}
