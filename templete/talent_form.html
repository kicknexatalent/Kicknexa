{% extends "base.html" %}{% block title %}Create Talent Profile | KICKNEXA{% endblock %}{% block content %}<div class="card"><h1>Create your talent profile</h1><p class="muted">Start with Sports or Music. Add a public showcase link so you can be discovered.</p><form method="post"><div class="grid"><div><label>Name<input required name="display_name"></label></div><div><label>Email<input required type="email" name="email"></label></div><div><label>Password<input required type="password" name="password" minlength="8"></label></div><div><label>Category<select name="category"><option>Sports</option><option>Music</option></select></label></div><div><label>Talent / sport<input name="subcategory" placeholder="Football, Singer, DJ..."></label></div><div><label>Country<input name="country" value="Tanzania"></label></div><div><label>City<input name="city" placeholder="Dar es Salaam"></label></div><div><label>Social profile URL<input name="social_url" placeholder="https://"></label></div><div class="full"><label>Bio<textarea name="bio" placeholder="Tell people what you do and what opportunity you are looking for."></textarea></label></div><div class="full"><label>Showcase video URL<input name="showcase_url" placeholder="YouTube, Vimeo or other public video URL"></label></div></div><button>Create Profile</button></form></div>{% endblock %}
